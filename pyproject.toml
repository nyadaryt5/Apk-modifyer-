[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-modifyer"
version = "0.1.0"
description = "One toolkit for decompiling, editing, rebuilding, signing and analysing APKs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["apk", "android", "apktool", "smali", "reverse-engineering", "signing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Only needed if you want the desktop Apktool engine; the native engines need nothing.
apktool = ["jdk4py>=17"]
dev = ["pytest>=7"]

[project.scripts]
apkmod = "apkmod.cli:main"

[tool.setuptools.packages.find]
include = ["apkmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
